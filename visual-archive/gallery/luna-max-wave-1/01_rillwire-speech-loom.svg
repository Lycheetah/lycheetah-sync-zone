<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rillwire: The Speech Loom</title>
  <desc id="desc">An invented visual map of five optional sentence-final routing tails. A spoken phrase carries a topic handle into a glowing loom, where return, lend, harbor, damp, and undo offer different paths. Routing does not change truth, and undo can reverse only the speaker's own latest choice.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091522"/>
      <stop offset="0.55" stop-color="#102a39"/>
      <stop offset="1" stop-color="#171d35"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8d6dc" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#76d6c1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f0cf95" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="handle" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#fff0c7"/>
      <stop offset="0.34" stop-color="#e8bd7d"/>
      <stop offset="1" stop-color="#9c6c5b"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f3b77e"/></marker>
    <marker id="arrow-lend" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#83e0c8"/></marker>
    <marker id="arrow-harbor" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#90b9ff"/></marker>
    <marker id="arrow-damp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c1a6ff"/></marker>
    <marker id="arrow-undo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff8ea3"/></marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .caps { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
      .body { font-size: 16px; }
      .muted { fill: #a9bec8; }
      .route { fill: none; stroke-width: 5; stroke-linecap: round; opacity: .93; }
      .gate { fill: #102432; stroke: #395260; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#night)"/>
  <circle cx="1030" cy="48" r="190" fill="#31425d" opacity=".11"/>
  <circle cx="160" cy="720" r="260" fill="#386d70" opacity=".08"/>
  <path d="M34 150H1166" stroke="#b9d9d8" stroke-opacity=".18"/>
  <path d="M34 690H1166" stroke="#b9d9d8" stroke-opacity=".18"/>

  <text x="58" y="54" class="caps" fill="#83e0c8">VISUAL FORGE · INVENTED LANGUAGE</text>
  <text x="55" y="108" fill="#f1ead8" font-size="42" font-family="Georgia,serif" letter-spacing="1">Rillwire</text>
  <text x="248" y="105" fill="#bbcad0" font-size="17">The speech loom · one handle, five optional routes</text>
  <g transform="translate(1010 63)">
    <circle r="28" fill="none" stroke="#83e0c8" stroke-opacity=".55"/>
    <circle r="19" fill="none" stroke="#f3b77e" stroke-opacity=".65" stroke-dasharray="3 5"/>
    <circle r="5" fill="#f1ead8"/>
    <text x="42" y="-4" class="caps" fill="#f1ead8">01 / 05</text>
    <text x="42" y="16" fill="#a9bec8" font-size="12">ROUTE STUDY</text>
  </g>

  <!-- A phrase enters from the left as three spoken pieces. -->
  <g>
    <rect x="58" y="230" width="278" height="254" rx="24" fill="#122a37" stroke="#54717d" stroke-width="1.5"/>
    <text x="82" y="267" class="caps" fill="#a9bec8">SPOKEN CLAUSE</text>
    <text x="82" y="306" fill="#f1ead8" font-size="16">speaker · action · handle</text>
    <g transform="translate(82 337)">
      <rect width="56" height="39" rx="11" fill="#21424a"/>
      <rect x="64" width="70" height="39" rx="11" fill="#21424a"/>
      <rect x="142" width="67" height="39" rx="11" fill="#694f48"/>
      <text x="28" y="25" text-anchor="middle" fill="#d9ebe4" font-size="15" font-weight="700">mi</text>
      <text x="99" y="25" text-anchor="middle" fill="#d9ebe4" font-size="15" font-weight="700">vemi</text>
      <text x="175" y="25" text-anchor="middle" fill="#fff0c7" font-size="15" font-weight="700">oru</text>
    </g>
    <text x="82" y="414" fill="#b9cbd0" font-size="15">“I place a word on the table …”</text>
    <rect x="82" y="435" width="91" height="30" rx="15" fill="#163c42" stroke="#83e0c8" stroke-opacity=".65"/>
    <text x="127" y="455" text-anchor="middle" fill="#a8f2dc" font-size="14" font-weight="700">TAIL → =le</text>
  </g>

  <!-- A soft voice-ribbon carries the handle into the loom. -->
  <path d="M336 360 C390 360 408 398 456 398" stroke="url(#voice)" stroke-width="12" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M336 360 C390 360 408 398 456 398" stroke="#e4f5e8" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
  <text x="371" y="335" fill="#9fb8bf" font-size="12" letter-spacing="1.5">A HANDLE TRAVELS</text>

  <!-- The handle is a woven center, not a verdict. -->
  <g transform="translate(557 400)">
    <circle r="116" fill="#e5bd7b" opacity=".08" filter="url(#glow)"/>
    <circle r="99" fill="#102632" stroke="#6f8c91" stroke-width="1.5"/>
    <circle r="83" fill="none" stroke="#93c8bd" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 8"/>
    <ellipse rx="62" ry="83" fill="none" stroke="#f2d49b" stroke-opacity=".6" stroke-width="2" transform="rotate(35)"/>
    <ellipse rx="62" ry="83" fill="none" stroke="#79d4c1" stroke-opacity=".5" stroke-width="2" transform="rotate(-35)"/>
    <circle r="52" fill="url(#handle)" stroke="#fff0c7" stroke-opacity=".75" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#182832" font-size="28" font-family="Georgia,serif" font-weight="700">oru</text>
    <text x="0" y="19" text-anchor="middle" fill="#24383b" font-size="10" font-weight="800" letter-spacing="2">HANDLE</text>
    <text x="0" y="132" text-anchor="middle" class="caps" fill="#bed6d5">A TOPIC TO CARRY</text>
  </g>

  <!-- Five distinct ribbons lead to five choices. -->
  <path class="route" d="M625 327 C692 245 727 198 808 198" stroke="#f3b77e" marker-end="url(#arrow-return)"/>
  <path class="route" d="M654 365 C713 316 748 289 808 289" stroke="#83e0c8" marker-end="url(#arrow-lend)"/>
  <path class="route" d="M657 400 C715 400 753 400 808 400" stroke="#90b9ff" marker-end="url(#arrow-harbor)"/>
  <path class="route" d="M645 444 C711 489 746 510 808 510" stroke="#c1a6ff" marker-end="url(#arrow-damp)"/>
  <path class="route" d="M612 473 C676 560 721 610 808 610" stroke="#ff8ea3" marker-end="url(#arrow-undo)"/>

  <!-- Each card keeps the tail optional and its effect bounded. -->
  <g transform="translate(830 164)">
    <rect class="gate" width="310" height="68" rx="17" stroke="#f3b77e" stroke-opacity=".7"/>
    <circle cx="35" cy="34" r="19" fill="#4b352c"/>
    <path d="M43 30a11 11 0 1 0 0 9M43 30v-9m0 9h-9" fill="none" stroke="#f3b77e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="29" fill="#f3b77e" font-size="17" font-weight="800">=ra  RETURN</text>
    <text x="68" y="50" fill="#c4d2d4" font-size="13">send the handle back to me</text>
  </g>
  <g transform="translate(830 255)">
    <rect class="gate" width="310" height="68" rx="17" stroke="#83e0c8" stroke-opacity=".7"/>
    <circle cx="35" cy="34" r="19" fill="#1c4544"/>
    <path d="M27 34h15m-5-6 6 6-6 6M35 25v-5m0 28v-5" fill="none" stroke="#83e0c8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="29" fill="#83e0c8" font-size="17" font-weight="800">=le  LEND</text>
    <text x="68" y="50" fill="#c4d2d4" font-size="13">available, if someone chooses</text>
  </g>
  <g transform="translate(830 366)">
    <rect class="gate" width="310" height="68" rx="17" stroke="#90b9ff" stroke-opacity=".7"/>
    <circle cx="35" cy="34" r="19" fill="#263b5c"/>
    <path d="M23 37c4-9 10-13 17-9 3 2 5 6 8 9M24 41h22" fill="none" stroke="#90b9ff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="68" y="29" fill="#90b9ff" font-size="17" font-weight="800">=hu  HARBOR</text>
    <text x="68" y="50" fill="#c4d2d4" font-size="13">hold open; no reply is due</text>
  </g>
  <g transform="translate(830 476)">
    <rect class="gate" width="310" height="68" rx="17" stroke="#c1a6ff" stroke-opacity=".7"/>
    <circle cx="35" cy="34" r="19" fill="#3b3158"/>
    <path d="M25 29h20M28 34h14M31 39h8" stroke="#c1a6ff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="68" y="29" fill="#c1a6ff" font-size="17" font-weight="800">=do  DAMP</text>
    <text x="68" y="50" fill="#c4d2d4" font-size="13">quiet this thread; keep its trace</text>
  </g>
  <g transform="translate(830 576)">
    <rect class="gate" width="310" height="68" rx="17" stroke="#ff8ea3" stroke-opacity=".7"/>
    <circle cx="35" cy="34" r="19" fill="#4e2e42"/>
    <path d="M43 29a10 10 0 1 0 1 10M43 29v-8m0 8h-8" fill="none" stroke="#ff8ea3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="29" fill="#ff9bae" font-size="17" font-weight="800">=ya  UNDO</text>
    <text x="68" y="50" fill="#c4d2d4" font-size="13">reverse my own last route</text>
  </g>

  <!-- The lower note marks the limits of the invented notation. -->
  <g transform="translate(58 565)">
    <path d="M0 0h258" stroke="#4f737e" stroke-width="1.5"/>
    <text x="0" y="29" class="caps" fill="#f1d59f">ROUTING ≠ TRUTH</text>
    <text x="0" y="54" class="body" fill="#b9cbd0">A tail moves a handle;</text>
    <text x="0" y="77" class="body" fill="#b9cbd0">it does not certify a claim.</text>
  </g>
  <g transform="translate(360 565)">
    <path d="M0 0h350" stroke="#4f737e" stroke-width="1.5"/>
    <text x="0" y="29" class="caps" fill="#f1d59f">A HANDLE IS NOT A COMMAND</text>
    <text x="0" y="54" class="body" fill="#b9cbd0">A route is offered. Refusal and silence</text>
    <text x="0" y="77" class="body" fill="#b9cbd0">stay with the person who chose them.</text>
  </g>

  <text x="58" y="738" fill="#839ba6" font-size="12" letter-spacing="1.3">INVENTED ROUTING LANGUAGE · STATIC VECTOR STUDY · READER TEST NOT YET RUN</text>
  <text x="1140" y="738" text-anchor="end" fill="#839ba6" font-size="12" letter-spacing="1.3">PALETTE / ONE-SHOT VISUAL</text>
</svg>
